<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PomoOffice Invite</title>
  <meta name="description" content="You've been invited to PomoOffice – get 50 coffee beans after your first focus session.">
  <style>
    :root { --bg: #FBF5EA; --card: #FFFAF4; --stroke: #E5DFD6; --ink: #262833; --muted: #7A7A75; --sage: #698762; --sage-fill: #E6EBDD; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: var(--bg); color: var(--ink); padding: 24px 16px;
           font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
    .card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--stroke);
            border-radius: 24px; padding: 32px 24px; text-align: center; }
    .emoji { font-size: 44px; margin-bottom: 8px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: var(--muted); font-size: 15px; line-height: 1.45; margin: 0 0 20px; }
    .code { display: inline-block; font: 700 24px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 3px;
            background: var(--sage-fill); color: var(--sage); padding: 10px 18px; border-radius: 14px; margin-bottom: 24px; }
    button { width: 100%; border: 0; background: var(--sage); color: #fff; font: 600 16px inherit;
             font-family: inherit; padding: 14px; border-radius: 999px; cursor: pointer; }
    .hint { font-size: 13px; margin: 14px 0 0; }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji">☕️</div>
    <h1 id="title">You've been invited to PomoOffice</h1>
    <p id="subtitle">Get 50 coffee beans after your first focus session.</p>
    <div class="code" id="code" hidden></div>
    <button id="download">Copy code &amp; download</button>
    <p class="hint" id="hint">After installing, tap “Paste” when the app asks for your invite code.</p>
  </main>

  <script>
    // Invite links look like /invite?code=MANU7K2. If the app is installed, iOS
    // opens it directly and this page is never shown.
    var APP_STORE = "https://apps.apple.com/app/id6759717785";
    var raw = new URLSearchParams(location.search).get("code") || "";
    var code = raw.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);

    var texts = {
      en: { title: "You've been invited to PomoOffice",
            subtitle: "Get 50 coffee beans after your first focus session.",
            button: "Copy code & download", buttonNoCode: "Download on the App Store",
            hint: "After installing, tap “Paste” when the app asks for your invite code." },
      de: { title: "Du wurdest zu PomoOffice eingeladen",
            subtitle: "Du bekommst 50 Kaffeebohnen nach deiner ersten Fokus-Session.",
            button: "Code kopieren & laden", buttonNoCode: "Im App Store laden",
            hint: "Tippe nach der Installation auf „Einsetzen“, wenn die App nach deinem Einladungscode fragt." }
    };
    var t = (navigator.language || "en").toLowerCase().indexOf("de") === 0 ? texts.de : texts.en;
    document.documentElement.lang = t === texts.de ? "de" : "en";

    document.getElementById("title").textContent = t.title;
    document.getElementById("subtitle").textContent = t.subtitle;
    var button = document.getElementById("download");
    var hint = document.getElementById("hint");

    if (code) {
      var codeEl = document.getElementById("code");
      codeEl.textContent = code;
      codeEl.hidden = false;
      button.textContent = t.button;
      hint.textContent = t.hint;
    } else {
      button.textContent = t.buttonNoCode;
      hint.hidden = true;
    }

    button.addEventListener("click", function () {
      var go = function () { location.href = APP_STORE; };
      if (code && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(go, go);
      } else {
        go();
      }
    });
  </script>
</body>
</html>
