<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PomoOffice</title>
  <meta name="description" content="PomoOffice – focus with friends.">
  <style>
    :root { --bg: #FBF5EA; --card: #FFFAF4; --stroke: #E5DFD6; --ink: #262833; --muted: #7A7A75; --sage: #698762; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: var(--bg); color: var(--ink); padding: 24px 16px;
           font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
    .card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--stroke);
            border-radius: 24px; padding: 32px 24px; text-align: center; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p { color: var(--muted); font-size: 15px; line-height: 1.45; margin: 0 0 24px; }
    .button { display: block; background: var(--sage); color: #fff; text-decoration: none; font-weight: 600;
              font-size: 16px; padding: 14px; border-radius: 999px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>PomoOffice</h1>
    <p>Focus with friends, earn coffee beans and build your own office.</p>
    <a class="button" href="https://apps.apple.com/app/id6759717785">Download on the App Store</a>
  </main>
</body>
</html>
